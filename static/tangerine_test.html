<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tangerine Font Animation Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .ambient-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, rgba(56, 189, 248, 0.06) 35%, #000000 80%);
            pointer-events: none;
        }

        .stage-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            width: 100%;
            max-width: 900px;
        }

        .svg-wrap {
            position: relative;
            width: 100%;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Tangerine Calligraphy Font */
        .tangerine-calligraphy {
            font-family: 'Tangerine', cursive;
            font-size: 155px;
            font-weight: 700;
            letter-spacing: 3px;
            text-anchor: middle;
            user-select: none;
        }

        /* Style A: Outlined Stroke Draw into Solid Luminous Fill */
        .stroke-anim {
            fill: transparent;
            stroke: #ffffff;
            stroke-width: 2.2px;
            stroke-dasharray: 1400;
            stroke-dashoffset: 1400;
            filter: drop-shadow(0 0 3px #ffffff) 
                    drop-shadow(0 0 12px rgba(255, 255, 255, 0.8))
                    drop-shadow(0 0 28px rgba(56, 189, 248, 0.45));
            animation: drawStroke 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                       fillGlow 0.9s ease 1.5s forwards;
        }

        @keyframes drawStroke {
            to { stroke-dashoffset: 0; }
        }

        @keyframes fillGlow {
            to {
                fill: #ffffff;
                stroke-width: 1px;
            }
        }

        /* Style B: Progressive Fluid Pen Write-On using SVG Clip Mask */
        .clip-revealer {
            animation: wipeReveal 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes wipeReveal {
            0% { width: 0px; }
            100% { width: 800px; }
        }

        .tangerine-pure {
            fill: #ffffff;
            filter: drop-shadow(0 0 2px #ffffff)
                    drop-shadow(0 0 10px rgba(255, 255, 255, 0.85))
                    drop-shadow(0 0 26px rgba(56, 189, 248, 0.4));
        }

        /* Traveling Luminous Pen Nib */
        .pen-nib {
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffffff, 0 0 24px #38bdf8, 0 0 40px #ffffff;
            pointer-events: none;
            opacity: 0;
        }

        /* Subline */
        .subline-box {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(12px);
            animation: sublineReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
        }

        @keyframes sublineReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subline-text {
            font-size: 0.82rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
            font-weight: 500;
        }

        .progress-track {
            width: 140px;
            height: 2px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff;
            animation: runProgress 1s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;
        }

        @keyframes runProgress {
            to { width: 100%; }
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 14px;
            width: 130px;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }
        button:hover {
            transform: scale(1.03);
            background: #e0f2fe;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="stage-container">
        <div class="svg-wrap">
            <svg viewBox="0 0 800 240">
                <defs>
                    <clipPath id="wipe-mask">
                        <rect id="mask-rect" class="clip-revealer" x="0" y="0" width="800" height="240" />
                    </clipPath>
                </defs>

                <!-- Layer 1: Calligraphic Outlined Stroke Draw -->
                <text id="stroke-text" class="tangerine-calligraphy stroke-anim" x="400" y="160">Lucky</text>

                <!-- Layer 2: Solid Pure Tangerine Calligraphy with Specular Sheen -->
                <g clip-path="url(#wipe-mask)">
                    <text id="fill-text" class="tangerine-calligraphy tangerine-pure" x="400" y="160">Lucky</text>
                </g>
            </svg>
        </div>

        <div id="subline" class="subline-box">
            <span id="subline-name" class="subline-text">WELCOME BACK, LUCKY</span>
            <div class="progress-track">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="name-input" value="Lucky" placeholder="Enter name...">
        <button onclick="playAnim()">Play Animation ✨</button>
    </div>

    <script>
        function playAnim() {
            const name = document.getElementById('name-input').value.trim() || 'Lucky';
            const strokeEl = document.getElementById('stroke-text');
            const fillEl = document.getElementById('fill-text');
            const maskRect = document.getElementById('mask-rect');
            const subline = document.getElementById('subline');
            const sublineName = document.getElementById('subline-name');

            strokeEl.textContent = name;
            fillEl.textContent = name;
            sublineName.textContent = `WELCOME BACK, ${name.toUpperCase()}`;

            // Reset animations
            strokeEl.style.animation = 'none';
            maskRect.style.animation = 'none';
            subline.style.animation = 'none';

            void strokeEl.offsetWidth;
            void maskRect.offsetWidth;
            void subline.offsetWidth;

            strokeEl.style.animation = 'drawStroke 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, fillGlow 0.9s ease 1.5s forwards';
            maskRect.style.animation = 'wipeReveal 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards';
            subline.style.animation = 'sublineReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards';
        }
    </script>
</body>
</html>
